name: Tests
on:
  workflow_call:

jobs:
  managed-suite:
    name: Managed suite (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: 22.23.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Prepare sandboxed Pi test runtime
        if: runner.os == 'macOS'
        run: |
          export HOME="$RUNNER_TEMP/syke-pi-home"
          rm -rf "$HOME"
          mkdir -p "$HOME"
          uv run python - <<'PY'
          from pathlib import Path
          from syke.llm.pi_client import ensure_pi_binary

          ensure_pi_binary()
          print(Path.home() / ".syke" / "pi" / "node_modules")
          PY
          echo "SYKE_TEST_PI_NODE_MODULES=$HOME/.syke/pi/node_modules" >> "$GITHUB_ENV"
      - run: uv run pytest tests -v --tb=short
      - name: Run prepared platform tests
        if: runner.os == 'macOS'
        run: uv run pytest -m platform tests/test_sandbox.py tests/test_pi_tools_bash.py -v --tb=short
